<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>TrustGuard History</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    >

    <link
        rel="stylesheet"
        href="css/style.css"
    >

</head>


<body>

<div class="container py-5">

    <div class="text-center mb-5">

        <span class="section-label">
            TRUSTGUARD
        </span>

        <h1>
            Analysis History
        </h1>

        <p class="text-muted">
            Previous TrustGuard analyses
        </p>

    </div>


    <div
        id="historyContainer"
        class="row g-4"
    >

        <div class="text-center">

            <div
                class="spinner-border text-primary"
                role="status"
            ></div>

            <p class="mt-3">
                Loading analysis history...
            </p>

        </div>

    </div>


    <div class="history-back-button">
    <a href="index.php" class="btn btn-primary">
        <i class="bi bi-arrow-left"></i> Back to TrustGuard
    </a>
</div>

</div>


<script>

async function loadHistory() {

    const container =
        document.getElementById(
            "historyContainer"
        );


    try {

        const response =
            await fetch(
                "api/history.php"
            );


        const result =
            await response.json();


        if (!result.success) {

            throw new Error(
                result.message ||
                "Unable to load history."
            );

        }


        container.innerHTML = "";


        if (
            !result.analyses ||
            result.analyses.length === 0
        ) {

            container.innerHTML = `

                <div class="col-12">

                    <div class="alert alert-info">

                        No analyses have been saved yet.

                    </div>

                </div>

            `;

            return;

        }


        result.analyses.forEach(function(item) {

    const card = document.createElement("div");

    card.className = "col-md-6 col-lg-3";
    card.style.cursor = "pointer";

    card.addEventListener("click", function() {

        window.location.href = "analysis.html?id=" + item.id;

    });


    /* SCORE COLOUR */

    let scoreColor = "#8B0000";

if (Number(item.trust_score) >= 80) {

    scoreColor = "#006400";

} else if (Number(item.trust_score) >= 50) {

    scoreColor = "#8B6508";

}


    /* HISTORY CARD */
const inputTypeLabel = {
    url: "URL",
    text: "Text",
    image: "Image",
    qr: "QR"
}[item.input_type] || item.input_type;
    card.innerHTML = `

        <div class="card h-100 shadow-sm border-0">

            <div class="card-body">

                <div class="d-flex justify-content-between align-items-center mb-3">

                    <span class="badge bg-light text-dark">
                        ${inputTypeLabel}
                    </span>

                    <strong class="history-score" style="color:${scoreColor} !important;">
    ${item.trust_score}/100
</strong>

                </div>

                <h5 class="card-title">
                    ${item.classification}
                </h5>

                <p class="text-muted">
                    ${item.risk_level}
                </p>

                ${
    item.input_type === "image"
        ? `
            <p class="card-text">
                Image content analyzed using OCR
            </p>
          `
        : `
            <p class="card-text">
                ${escapeHTML(item.input_content)}
            </p>
          `
}

                <small class="text-muted">
                    ${item.created_at}
                </small>

            </div>

        </div>

    `;

    container.appendChild(card);

});

    }

    catch (error) {

        console.error(
            "History error:",
            error
        );


        container.innerHTML = `

            <div class="col-12">

                <div class="alert alert-danger">

                    Unable to load analysis history.

                </div>

            </div>

        `;

    }

}


function escapeHTML(value) {

    const div =
        document.createElement(
            "div"
        );


    div.textContent =
        value || "";


    return div.innerHTML;

}


loadHistory();

</script>

</body>

</html>
